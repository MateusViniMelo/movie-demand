services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    volumes:
      - catalogo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  catalogo_pg:
